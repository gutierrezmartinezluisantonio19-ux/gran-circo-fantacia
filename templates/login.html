```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Acceso administrador - Gran Circo Fantacia</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #fff7e6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login {
            background-color: white;
            width: 90%;
            max-width: 420px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
        }

        h1 {
            color: #8b0000;
            margin-bottom: 10px;
        }

        p {
            margin-bottom: 25px;
            color: #555;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            background-color: #8b0000;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #a50000;
        }

        .error {
            color: #b00020;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .volver {
            display: inline-block;
            margin-top: 20px;
            color: #222;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login">

        <h1>🔐 Administrador</h1>

        <p>Inicia sesión para acceder al panel.</p>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            <input
                type="text"
                name="usuario"
                placeholder="Usuario"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Contraseña"
                required
            >

            <button type="submit">
                👑 Iniciar sesión
            </button>

        </form>

        <a href="/" class="volver">
            🏠 Regresar al inicio
        </a>

    </div>

</body>
</html>
```
